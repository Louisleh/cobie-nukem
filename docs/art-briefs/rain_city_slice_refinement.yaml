work_id: CN-GAUNTLET-20260929-G3-SLICE-REFINEMENT-PROPOSAL
status: Root-approved bounded authoring candidate; acceptance pending source-bound runtime review.
target: Rain City Slice service-front construction and bake/prep/collection differentiation; a readable working pizza shop rather than three uniformly glowing display panels.
