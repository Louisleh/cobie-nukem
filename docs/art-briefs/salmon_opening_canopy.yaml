preserved_gameplay_contracts: World builder, collision, navigation, route gates, checkpoints, combat, spawn/balance, HUD and wrapper are byte-frozen. Tree crowns outside x +/-14 and added wall skins overlap the existing boundary face by at most 3cm to prevent z-fighting; no new geometry in the playable gate or travel lane.
acceptance_evidence: Before/candidate/difference at matching staging and four aspect families, import and geometry/collision contracts, mapped first-30 route at desktop and tablet, rendered native profiler, fresh exports and packaged browser smoke. Web trace remains explicitly open if new MCP is unavailable in this session. No approved baseline overwrite.
human_review_questions: Does this read as a rainy PNW park rather than a test arena? Is the shed still the first destination? Do the trees remain quiet behind live threats? Is the change clearly better at desktop and tablet size?
out_of_scope: Shed interior, Rain City art expansion, new missions/weapons/enemies, progression changes, balance, billboard enemy replacement, HUD redesign, public deployment or BETA graduation.
